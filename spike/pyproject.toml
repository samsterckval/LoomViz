[project]
name = "loomviz-spike"
version = "0.0.0"
description = "M0 feasibility spike for LoomViz (throwaway; not imported by app code)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wireviz==0.4.1",
    "ruamel.yaml>=0.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
