[project]
name = "loomviz"
version = "0.0.1"
description = "Web-based editor for WireViz wiring harness diagrams"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "wireviz==0.4.1",
    "pyyaml>=6",
    "watchfiles>=1.3.0",
    "websockets>=17.2",
]

[project.scripts]
loomviz = "loomviz.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["wireviz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
